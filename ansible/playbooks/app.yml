- name: Deploy FastAPI application
  hosts: fastapi
  become: true
  vars:
    nexus_registry: "34.232.109.10:8082"
  roles:
    - docker
  tasks:
    - name: Configure Docker insecure registry for Nexus
      copy:
        content: |
          {
            "insecure-registries": ["{{ nexus_registry }}"]
          }
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
      notify: Restart docker

    - name: Flush handlers to apply insecure registry config before pulling
      meta: flush_handlers

    - name: Log in to Nexus Docker registry
      community.docker.docker_login:
        registry_url: "{{ nexus_registry }}"
        username: "{{ nexus_user }}"
        password: "{{ nexus_password }}"

    - name: Create app network so containers can resolve each other by name
      community.docker.docker_network:
        name: fastapi-net
        state: present

    - name: Run node_exporter container
      community.docker.docker_container:
        name: node-exporter
        image: prom/node-exporter:latest
        restart_policy: always
        ports:
          - "9100:9100"
        volumes:
          - /proc:/host/proc:ro
          - /sys:/host/sys:ro
          - /:/rootfs:ro
        command:
          - '--path.procfs=/host/proc'
          - '--path.sysfs=/host/sys'

    - name: Run Postgres container
      community.docker.docker_container:
        name: db
        image: postgres:11.5-alpine
        restart_policy: always
        networks:
          - name: fastapi-net
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        volumes:
          - postgres-data:/var/lib/postgresql/data

    - name: Deploy FastAPI container
      community.docker.docker_container:
        name: fastapi-app
        image: "{{ docker_image | default(nexus_registry + '/fastapi-realworld-example-app:latest') }}"
        pull: true
        restart_policy: always
        networks:
          - name: fastapi-net
        env:
          DATABASE_URL: "postgresql://postgres:postgres@db/postgres"
          SECRET_KEY: "{{ app_secret_key }}"
        ports:
          - "8000:8000"

  handlers:
    - name: Restart docker
      systemd:
        name: docker
        state: restarted